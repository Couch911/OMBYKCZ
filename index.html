<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Практична робота №7 — WebSocket Чат</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f0f2f5;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .chat-container {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #2563eb;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header h1 { font-size: 18px; font-weight: 600; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      background: rgba(255,255,255,0.2);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.online { background: #22c55e; }
    
    .connection-panel {
      padding: 12px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .connection-panel input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s;
    }
    .btn-connect { background: #22c55e; color: #fff; }
    .btn-connect:hover { background: #16a34a; }
    .btn-disconnect { background: #ef4444; color: #fff; }
    .btn-disconnect:hover { background: #dc2626; }
    .btn-send { background: #2563eb; color: #fff; padding: 10px 18px; font-size: 14px; }
    .btn-send:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-messages {
      flex: 1;
      height: 380px;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.4;
      font-size: 14px;
      word-break: break-word;
    }
    .message.system {
      align-self: center;
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      border-radius: 20px;
      padding: 4px 12px;
      text-align: center;
    }
    .message.incoming {
      align-self: flex-start;
      background: #e2e8f0;
      color: #0f172a;
    }
    .message.outgoing {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
    }
    .message-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      margin-bottom: 4px;
      opacity: 0.8;
    }
    .message.outgoing .message-meta { justify-content: flex-end; }

    .chat-input-area {
      padding: 14px 20px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      display: flex;
      gap: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .chat-input-area input:focus { border-color: #2563eb; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>WebSocket Чат (Варіант 1)</h1>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Відключено</span>
    </div>
  </div>

  <div class="connection-panel">
    <input type="text" id="usernameInput" placeholder="Ваше ім'я (наприклад: Бондаренко Костя)" value="Користувач 1">
    <button class="btn-connect" id="btnConnect" onclick="connect()">Підключитись</button>
    <button class="btn-disconnect" id="btnDisconnect" onclick="disconnect()" disabled>Відключитись</button>
  </div>

  <div class="chat-messages" id="messagesList"></div>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Введіть повідомлення..." disabled onkeydown="if(event.key === 'Enter') sendMessage()">
    <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>Надіслати</button>
  </div>
</div>

<script>
  let socket = null;
  const WS_URL = 'ws://localhost:8080';

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const btnConnect = document.getElementById('btnConnect');
  const btnDisconnect = document.getElementById('btnDisconnect');
  const usernameInput = document.getElementById('usernameInput');
  const messageInput = document.getElementById('messageInput');
  const btnSend = document.getElementById('btnSend');
  const messagesList = document.getElementById('messagesList');

  function updateStatus(connected) {
    if (connected) {
      statusDot.classList.add('online');
      statusText.textContent = 'Підключено (ws://localhost:8080)';
      btnConnect.disabled = true;
      btnDisconnect.disabled = false;
      messageInput.disabled = false;
      btnSend.disabled = false;
      messageInput.focus();
    } else {
      statusDot.classList.remove('online');
      statusText.textContent = 'Відключено';
      btnConnect.disabled = false;
      btnDisconnect.disabled = true;
      messageInput.disabled = true;
      btnSend.disabled = true;
    }
  }

  function appendMessage(msg, type = 'incoming') {
    const el = document.createElement('div');
    el.className = `message ${type}`;

    if (type === 'system') {
      el.textContent = `${msg.timestamp} — ${msg.text}`;
    } else {
      const meta = document.createElement('div');
      meta.className = 'message-meta';
      
      const author = document.createElement('strong');
      author.textContent = msg.username;
      
      const time = document.createElement('span');
      time.textContent = msg.timestamp;

      meta.appendChild(author);
      meta.appendChild(time);

      const text = document.createElement('div');
      text.textContent = msg.text;

      el.appendChild(meta);
      el.appendChild(text);
    }

    messagesList.appendChild(el);
    messagesList.scrollTop = messagesList.scrollHeight;
  }

  function connect() {
    if (socket && socket.readyState === WebSocket.OPEN) return;

    socket = new WebSocket(WS_URL);

    socket.onopen = () => {
      console.log('[WebSocket] З’єднання встановлено');
      updateStatus(true);
    };

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        console.log('[WebSocket] Отримано повідомлення від сервера:', data);

        if (data.type === 'history') {
          messagesList.innerHTML = '';
          data.payload.forEach(item => {
            const isMine = item.username === usernameInput.value.trim();
            appendMessage(item, isMine ? 'outgoing' : 'incoming');
          });
        } else if (data.type === 'new_message') {
          const isMine = data.payload.username === usernameInput.value.trim();
          appendMessage(data.payload, isMine ? 'outgoing' : 'incoming');
        } else if (data.type === 'system') {
          appendMessage(data.payload, 'system');
        }
      } catch (err) {
        console.error('[WebSocket] Помилка обробки повідомлення:', err);
      }
    };

    socket.onclose = (event) => {
      console.log(`[WebSocket] З’єднання закрито (код: ${event.code}, причина: ${event.reason})`);
      updateStatus(false);
      appendMessage({ text: 'З’єднання з сервером розірвано', timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) }, 'system');
    };

    socket.onerror = (err) => {
      console.error('[WebSocket] Помилка:', err);
    };
  }

  function disconnect() {
    if (socket) {
      socket.close(1000, 'Клієнт ініціював закриття');
    }
  }

  function sendMessage() {
    const text = messageInput.value.trim();
    const username = usernameInput.value.trim() || 'Анонім';
    if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

    const messagePayload = {
      type: 'send_message',
      payload: {
        username: username,
        text: text
      }
    };

    socket.send(JSON.stringify(messagePayload));
    console.log('[WebSocket] Відправлено на сервер:', messagePayload);
    messageInput.value = '';
  }

  window.addEventListener('DOMContentLoaded', () => {
    connect();
  });
</script>

</body>
</html>
